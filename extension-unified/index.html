<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>贸大课程库</title><link rel="stylesheet" href="style.css"></head><body>
<header><span class="logo">▦</span><h1>我的课程库</h1><span class="version">合一版</span><span id="term"></span><div class="header-actions"><button id="sync">↻ 同步课程与主修</button><button id="cancel" hidden>取消</button><a href="https://bkxk.uibe.edu.cn/" target="_blank" rel="noopener">原选课系统 ↗</a></div></header>
<nav class="scopes" aria-label="课程视图"><button data-scope="all" aria-pressed="true">▦ 全部课程</button><button data-scope="main" aria-pressed="false">我的主修</button><button data-scope="absent" aria-pressed="false">未在主修列表</button><button data-scope="unknown" aria-pressed="false">待核验</button></nav>
<div class="toolbar"><label class="layout-picker">页面布局 <select id="layout" aria-label="页面布局"><option value="table">多维表格</option><option value="sidebar">侧栏筛选</option></select></label><input type="search" id="search" aria-label="搜索课程" placeholder="搜索课程、教师、课程号…"><label class="sort">排序 <select id="sort"><option value="code:asc">课程号 ↑</option><option value="credits:asc">学分 ↑</option><option value="credits:desc">学分 ↓</option><option value="remaining:desc">剩余名额 ↓</option><option value="selected:desc">选课人数 ↓</option><option value="capacity:desc">课容量 ↓</option><option value="name:asc">课程名称 ↑</option></select></label><button type="reset" form="filters">清空筛选</button><span class="hint">点击课程名称查看完整排课</span></div>
<form id="filters"><div class="advanced"><label><input name="available" type="checkbox">只看有余量</label><details><summary>人数 / 容量范围</summary><div class="range-panel"><label>选课人数<input name="selectedMin" type="number" min="0" placeholder="最少" aria-label="最少选课人数"><input name="selectedMax" type="number" min="0" placeholder="最多" aria-label="最多选课人数"></label><label>课容量<input name="capacityMin" type="number" min="0" placeholder="最小" aria-label="最小课容量"><input name="capacityMax" type="number" min="0" placeholder="最大" aria-label="最大课容量"></label></div></details><span id="count"></span><span id="main-summary"></span></div>
<div class="workspace"><aside id="sidebar" hidden><h2>筛选条件</h2><div id="sidebar-fields"></div></aside><div class="table-wrap"><table><colgroup><col style="width:48px"><col style="width:240px"><col style="width:155px"><col style="width:75px"><col style="width:115px"><col style="width:135px"><col style="width:155px"><col style="width:120px"><col style="width:200px"><col style="width:195px"></colgroup><thead><tr><th>#</th><th>文本　课程名称</th><th>编号　课程 / 课序号</th><th>＃ 学分</th><th>授课教师</th><th>上课时间</th><th>上课地点</th><th>人数 / 容量</th><th>课程类型</th><th>主修归属</th></tr><tr class="column-filters"><th></th><th><input name="name" type="search" aria-label="筛选课程名称" placeholder="筛选名称…"></th><th><input name="number" type="search" aria-label="筛选课程号课序号" placeholder="忽略空格与大小写"></th><th><select name="credits" id="credits" aria-label="筛选学分"></select></th><th><input name="teacher" type="search" aria-label="筛选教师" placeholder="姓名…"></th><th><input name="times" aria-label="时间代码" placeholder="12、13、51"><select name="timeMode" aria-label="时间匹配方式"><option value="any">匹配任一</option><option value="all">包含全部</option><option value="exclude">排除</option></select></th><th><input name="place" type="search" aria-label="筛选地点" placeholder="博学 207…"></th><th><span>按同步时数据</span></th><th><select id="types" name="types" aria-label="筛选课程类型"></select></th><th><span>使用上方视图切换</span></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden><strong>没有符合条件的课程</strong><p id="empty-tip"></p></div></div></div></form>
<footer><span id="source">正在加载…</span><span id="status" role="status" aria-live="polite"></span><div class="pagination"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></footer>
<dialog id="detail"><div class="detail-head"><h2 id="detail-title"></h2><button id="close-detail" aria-label="关闭课程详情" type="button">✕</button></div><dl id="detail-body"></dl><p class="detail-note">主修以当前选课列表为依据，不等于完整培养方案。容量与资格请以原站为准。</p></dialog><script type="module" src="app.js"></script></body></html>
